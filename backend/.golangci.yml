version: "2"

# 后端质量门禁：standard 默认集 + 依赖方向（depguard）。
# 依赖方向来自 specs/2026-10-27-classroom-availability-rewrite/design.md 与
# specs/2026-11-08-admin-settings-sync/design.md 的「依赖方向」。

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - depguard   # 强制分层依赖方向，越层即失败
    - bodyclose  # HTTP 响应体必须关闭
    - errorlint  # 错误比较必须走 errors.Is/As
    - gocritic   # 常见可疑写法
    - misspell   # 拼写
    - noctx      # 出站请求必须带 context
    - revive     # 风格与注释
    - unconvert  # 多余类型转换
    - unparam    # 未被使用的参数
    - whitespace # 多余空行

  settings:
    depguard:
      rules:
        # 实体与错误码：只允许标准库，避免数据层反向依赖业务。
        model:
          files:
            - "**/internal/model/**"
          allow:
            - $gostd

        # 鉴权纯逻辑：只依赖实体、标准库与 argon2，不碰 HTTP、SQL 或配置。
        # x/crypto/argon2 是本 spec 唯一新增的直接依赖（D4），只放行这一个子包。
        auth:
          files:
            - "**/internal/auth/**"
          allow:
            - $gostd
            - github.com/w1ndys/easy-qfnu-kjs/internal/model
            - golang.org/x/crypto/argon2

        # 纯解析：只依赖实体与 HTML 解析库，不碰网络与数据库。
        # goquery 是 docs/pitfalls.md 第 10 节指定的唯一结构解析手段（v1.13.0）；
        # depguard 只检查直接 import，其依赖 cascadia 与 golang.org/x/net 不必列出。
        parser:
          files:
            - "**/internal/parser/**"
          allow:
            - $gostd
            - github.com/w1ndys/easy-qfnu-kjs/internal/model
            - github.com/PuerkitoBio/goquery

        # 纯变换：同上，保持可测无副作用。
        clean:
          files:
            - "**/internal/clean/**"
          allow:
            - $gostd
            - github.com/w1ndys/easy-qfnu-kjs/internal/model

        # 上游客户端：解析交给 parser，所以只允许实体与标准库。
        upstream:
          files:
            - "**/internal/upstream/**"
          allow:
            - $gostd
            - github.com/w1ndys/easy-qfnu-kjs/internal/model

        # 存储层：只依赖实体与驱动。
        store:
          files:
            - "**/internal/store/**"
          allow:
            - $gostd
            - github.com/w1ndys/easy-qfnu-kjs/internal/model
            - github.com/jackc/pgx/v5
            - github.com/w1ndys/easy-qfnu-kjs/migrations

        # 编排：可调上游、解析、清洗与存储，不直接写 HTTP 或 SQL 细节。
        pipeline:
          files:
            - "**/internal/pipeline/**"
          allow:
            - $gostd
            - github.com/w1ndys/easy-qfnu-kjs/internal/model
            - github.com/w1ndys/easy-qfnu-kjs/internal/upstream
            - github.com/w1ndys/easy-qfnu-kjs/internal/parser
            - github.com/w1ndys/easy-qfnu-kjs/internal/clean
            - github.com/w1ndys/easy-qfnu-kjs/internal/store

        # 发布：只做校验与事务切换。
        publish:
          files:
            - "**/internal/publish/**"
          allow:
            - $gostd
            - github.com/w1ndys/easy-qfnu-kjs/internal/model
            - github.com/w1ndys/easy-qfnu-kjs/internal/store

        # 查询：读存储，可调统计聚合。
        query:
          files:
            - "**/internal/query/**"
          allow:
            - $gostd
            - github.com/w1ndys/easy-qfnu-kjs/internal/model
            - github.com/w1ndys/easy-qfnu-kjs/internal/store
            - github.com/w1ndys/easy-qfnu-kjs/internal/stats

        # 统计：记账与聚合，只碰存储与实体。
        stats:
          files:
            - "**/internal/stats/**"
          allow:
            - $gostd
            - github.com/w1ndys/easy-qfnu-kjs/internal/model
            - github.com/w1ndys/easy-qfnu-kjs/internal/store

        # 业务设置：快照、Patch 语义、校验、加封与单事务写。
        # 不 import store：settings.Store 是消费侧接口，由装配层用 store.SettingsRepo
        # 做结构匹配（装配层 var _ settings.Store = store.SettingsRepo{}），SQL 只留在 store。
        settings:
          files:
            - "**/internal/settings/**"
          allow:
            - $gostd
            - github.com/w1ndys/easy-qfnu-kjs/internal/model
            - github.com/w1ndys/easy-qfnu-kjs/internal/secret
            - github.com/w1ndys/easy-qfnu-kjs/internal/cronexpr

        # 纯 cron 解析与求值：只放业务时区与解析，不碰 HTTP、SQL 或时钟。
        cronexpr:
          files:
            - "**/internal/cronexpr/**"
          allow:
            - $gostd
            - github.com/w1ndys/easy-qfnu-kjs/internal/model

        # 进程内调度：表达式来源与触发器都是消费侧接口/函数，不 import runner，
        # 也不 import settings —— 装配层把 settings.Service 与 runner.StartCron 传进来。
        scheduler:
          files:
            - "**/internal/scheduler/**"
          allow:
            - $gostd
            - github.com/w1ndys/easy-qfnu-kjs/internal/model
            - github.com/w1ndys/easy-qfnu-kjs/internal/cronexpr

        # 启动端口：采集执行器由接口注入，不 import upstream / pipeline。
        # Converge 是函数，装配层用 pipeline.ConvergeStaleRuns 包装后传入（D8）。
        runner:
          files:
            - "**/internal/runner/**"
          allow:
            - $gostd
            - github.com/w1ndys/easy-qfnu-kjs/internal/model
            - github.com/w1ndys/easy-qfnu-kjs/internal/store

        # 采集执行器：唯一的「有副作用的总装」，把上游、解析/清洗、编排与发布串起来。
        # 方向见 specs/2026-11-09-collect-runner/design.md 的「依赖方向」：
        # collector → pipeline, publish, upstream, parser, clean, store, settings, model, runner
        # （runner 只用于 var _ runner.Collector = (*Collector)(nil) 的编译期断言）。
        # 不 import secret：密码明文只从 settings.Service.Reveal 出来，执行器拿不到
        # 密钥与密文（settings 的规则已在上面写明它不 import store，这里不重复）。
        collector:
          files:
            - "**/internal/collector/**"
          allow:
            - $gostd
            - github.com/w1ndys/easy-qfnu-kjs/internal/model
            - github.com/w1ndys/easy-qfnu-kjs/internal/upstream
            - github.com/w1ndys/easy-qfnu-kjs/internal/parser
            - github.com/w1ndys/easy-qfnu-kjs/internal/clean
            - github.com/w1ndys/easy-qfnu-kjs/internal/pipeline
            - github.com/w1ndys/easy-qfnu-kjs/internal/publish
            - github.com/w1ndys/easy-qfnu-kjs/internal/store
            - github.com/w1ndys/easy-qfnu-kjs/internal/settings
            - github.com/w1ndys/easy-qfnu-kjs/internal/runner

        # HTTP 层：编排与查询都从这一层进，不直接访问上游。
        # auth 只被管理端中间件用来判定会话有效性与比对 CSRF，属于纯函数调用，没有反向依赖。
        # secret 只被管理端的 state/init 用来取指纹与一次性创建密钥，同样是纯能力调用。
        # settings 是业务设置的读写服务（GET/PUT /api/admin/settings），cronexpr 被设置端点
        # 直接用来算 cron_next_at；两者都只是调用，不存在反向依赖。
        # runner 只被 POST /api/admin/sync 消费：handler 拿 runner.StartResult 拼 202 的
        # data、用 *runner.BusyError 拼 409 文案，不反向依赖 HTTP 层。
        # 四个新包各自的「不许 import 谁」见上面的 settings/cronexpr/scheduler/runner 规则。
        api:
          files:
            - "**/internal/api/**"
          allow:
            - $gostd
            - github.com/w1ndys/easy-qfnu-kjs/internal/model
            - github.com/w1ndys/easy-qfnu-kjs/internal/query
            - github.com/w1ndys/easy-qfnu-kjs/internal/publish
            - github.com/w1ndys/easy-qfnu-kjs/internal/pipeline
            - github.com/w1ndys/easy-qfnu-kjs/internal/stats
            - github.com/w1ndys/easy-qfnu-kjs/internal/store
            - github.com/w1ndys/easy-qfnu-kjs/internal/config
            - github.com/w1ndys/easy-qfnu-kjs/internal/auth
            - github.com/w1ndys/easy-qfnu-kjs/internal/secret
            - github.com/w1ndys/easy-qfnu-kjs/internal/settings
            - github.com/w1ndys/easy-qfnu-kjs/internal/cronexpr
            - github.com/w1ndys/easy-qfnu-kjs/internal/runner
