version: '3'

# 仓库根 Taskfile：把日常运维与质量门禁收在一处，避免记一长串 docker compose / go / pnpm 参数。
# 用法：task（列出全部任务）、task up、task logs service=server、task gate

vars:
  # 编排文件在 deploy/ 下，所有 compose 命令都带 -f；compose 以该文件所在目录为项目目录，
  # 所以 build.context 等相对路径相对 deploy/ 解析（编排文件里有注释说明）。
  # --env-file 必须显式给：compose 的默认环境文件按项目目录找（deploy/.env），不会读仓库根的 .env。
  # 真实值在仓库根 .env（gitignore），由 task deploy:env 从 .env.example 复制出来。
  COMPOSE: docker compose -f deploy/compose.yaml --env-file .env
  GO: go
  PNPM: pnpm
  # 数据库连接串仅用于本机排障，容器内连接以 compose 环境变量为准。
  # 这里不给默认值：postgres 不映射宿主端口（宿主端口只落在 web），5432 在宿主上连不通。
  # 确实要从宿主连时，先给 postgres 临时加一条端口映射，例如
  #   ports: ["127.0.0.1:15432:5432"]
  # 再取消下行注释并换成 .env 里的真实口令；不改编排就用 task db:psql 直接进容器。
  # LOCAL_DSN: postgres://kjs:CHANGE_ME@127.0.0.1:15432/easy_qfnu_kjs?sslmode=disable
  BACKUP_DIR: ./backup

tasks:
  default:
    desc: 列出可用任务
    cmds:
      - task --list

  # ---------- 编排 ----------
  up:
    desc: 构建并启动 web + server + postgres (+ backup)
    preconditions:
      - sh: test -f .env
        msg: 缺少 .env：先 `task deploy:env`（或 `cp .env.example .env`）并填 POSTGRES_PASSWORD
    cmds:
      - '{{.COMPOSE}} up -d --build'

  down:
    desc: 停止并移除 web + server + postgres (+ backup)（保留数据卷）
    preconditions:
      - sh: test -f .env
        msg: 缺少 .env：先 `task deploy:env`（或 `cp .env.example .env`）并填 POSTGRES_PASSWORD
    cmds:
      - '{{.COMPOSE}} down'

  ps:
    desc: 查看四个服务状态（web / server / postgres / backup，含已退出的 Exited）
    preconditions:
      - sh: test -f .env
        msg: 缺少 .env：先 `task deploy:env`（或 `cp .env.example .env`）并填 POSTGRES_PASSWORD
    cmds:
      - '{{.COMPOSE}} ps --all'

  logs:
    desc: 跟踪日志，可用 service=web|server|postgres|backup 只看一个
    preconditions:
      - sh: test -f .env
        msg: 缺少 .env：先 `task deploy:env`（或 `cp .env.example .env`）并填 POSTGRES_PASSWORD
    cmds:
      - '{{.COMPOSE}} logs -f {{.service}}'

  restart:
    desc: 重启指定服务，默认 server
    vars:
      target: '{{default "server" .service}}'
    cmds:
      - '{{.COMPOSE}} restart {{.target}}'

  build:
    desc: 构建两个镜像（web 与 server，不启动；backup 直接用 postgres 镜像）
    cmds:
      - '{{.COMPOSE}} build'

  # ---------- 部署 ----------
  deploy:env:
    desc: 首次部署生成 .env（已存在则只提示、不覆盖），随后填 POSTGRES_PASSWORD
    # 只做复制，不替用户编口令：POSTGRES_PASSWORD 留空，由运维自己填。
    # .env 已存在时保持原样并 exit 0：这个 target 会在部署流程里被重复调用，不能覆盖真实口令。
    cmds:
      - |
        if [ -f .env ]; then
          echo "deploy:env: .env 已存在，不覆盖（要重建先自行备份并删除 .env）"
          exit 0
        fi
        cp .env.example .env
        echo "deploy:env: 已从 .env.example 生成 .env"
        echo "deploy:env: 请填写 POSTGRES_PASSWORD（按需再改 BIND_ADDR / SERVER_PORT / IMAGE_TAG）"

  deploy:backup:
    desc: 手动执行一次备份（与每日 03:15 定时任务同一份脚本）
    # 与 up/ps/down/logs 同一口径：.env 缺失时直接拒绝，而不是让 compose 用空口令跑。
    # 必须覆盖 entrypoint：否则会用默认入口再起一个 crond，而不是执行一次备份。
    preconditions:
      - sh: test -f .env
        msg: 缺少 .env：先 `task deploy:env`（或 `cp .env.example .env`）并填 POSTGRES_PASSWORD
    cmds:
      - '{{.COMPOSE}} run --rm --entrypoint /scripts/backup.sh backup'

  deploy:restore:
    desc: 恢复备份到显式目标库（演练一律用临时库；需 file=backup/xxx.dump 与 target=库名，CONFIRM=yes 才执行）
    # 目标库必须由运维显式给出：绝不默认恢复进 POSTGRES_DB，避免一次手滑覆盖生产库。
    # CONFIRM 不硬编码：它由用户显式传，空值时交给 restore.sh 的确认门拒绝（负向用例也据此验证）。
    requires:
      vars: [file, target]
    preconditions:
      - sh: test -f .env
        msg: 缺少 .env：先 `task deploy:env`（或 `cp .env.example .env`）并填 POSTGRES_PASSWORD
      - sh: test -f '{{.file}}'
        msg: 备份文件不存在：{{.file}}（先 task deploy:backup，或确认路径相对仓库根）
    cmds:
      - |
        {{.COMPOSE}} run --rm --entrypoint /scripts/restore.sh \
          -e TARGET_DB={{.target}} \
          -e BACKUP_FILE=/backup/$(basename "{{.file}}") \
          -e CONFIRM={{.CONFIRM}} \
          backup

  deploy:secret-backup:
    desc: 导出加密密钥到 ./backup/secret/secret.key（权限 600，内容不进 stdout/日志）
    preconditions:
      - sh: test -f .env
        msg: 缺少 .env：先 `task deploy:env`（或 `cp .env.example .env`）并填 POSTGRES_PASSWORD
    cmds:
      - sh deploy/scripts/secret-backup.sh

  # ---------- 部署门禁与体检 ----------
  # 与 `gate` 的分工（design D10，已定）：`gate` 的 7 项不依赖 Docker、CI 上也能跑；
  # deploy:check 要构建两个镜像，是分钟级的，所以保持独立 target、不并入 gate。
  # 改编排 / 镜像 / nginx / 脚本 / 配置时手动追加跑 deploy:check。
  deploy:check-config:
    desc: 快速校验（不构建镜像）：compose 配置合法 + .env.example 与 config 对齐
    # 占位口令只作为 shell 环境变量注入。shell 环境优先于 --env-file，所以 .env.example
    # 里的 POSTGRES_PASSWORD 保持空行，干净检出（没有 .env）也能过这一步。
    cmds:
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ci-placeholder} docker compose -f deploy/compose.yaml --env-file .env.example config -q'
      # 对齐测试就在后端测试包里（gate 的后端 test 同样会跑到），这里给一个只跑它的快速入口。
      # -count=1 关掉结果缓存：测试读的是仓库根 .env.example（包外文件），go test 的缓存键
      # 看不到它的变化，不加就可能拿上一次的 ok 冒充通过。
      - 'cd backend && {{.GO}} test -count=1 ./internal/config -run TestEnvExample'

  deploy:check:
    desc: 部署门禁（独立于 task gate，改编排/镜像/nginx/脚本/配置时手动跑）：config → 配置对齐 → sh -n → 构建两镜像 → nginx -t
    cmds:
      - task: deploy:check-config
      - |
        set -eu
        # deploy/ 下每个 shell 脚本都过一遍语法检查（含 backup/entrypoint.sh 与 scripts/smoke.sh）。
        # 逐个文件调用：任一个语法错都以非零退出码结束，Task 会停在这一步、不进入构建。
        for f in $(find deploy -type f -name '*.sh' | sort); do
          echo "==> sh -n $f"
          sh -n "$f"
        done
      # build 同样要解析整份编排，占位口令必须注入；退出码 0 且 web 与 server 两个镜像都
      # 构建出来才算过。
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ci-placeholder} docker compose -f deploy/compose.yaml --env-file .env.example build'
      # 容器的 entrypoint 会先用 BACKEND_UPSTREAM 渲染模板再校验语法，所以这一步验的是
      # 「模板 + 上游变量 + 配置」三件套；显式给上游值——留空时 nginx -t 按 design 必然失败。
      - 'docker run --rm -e BACKEND_UPSTREAM=server:18080 easy-qfnu-kjs-web:local nginx -t'

  deploy:health:
    desc: 体检：容器状态 + 经 web 宿主端口的 /healthz、/readyz + 最近备份时间（超 26 小时非零退出）
    # 与 up/ps/down/logs 同一口径：缺 .env 直接拒绝，而不是让 compose 用空口令拼出错误提示。
    preconditions:
      - sh: test -f .env
        msg: 缺少 .env：先 `task deploy:env`（或 `cp .env.example .env`）并填 POSTGRES_PASSWORD
    cmds:
      - |
        set -eu

        echo "== 容器状态（{{.COMPOSE}} ps --all）=="
        {{.COMPOSE}} ps --all

        echo
        echo "== 探针（经 web 的宿主端口）=="
        # 宿主端口只从 compose 的映射里取（BIND_ADDR:SERVER_PORT 可能不是默认值）。
        if ! bind=$({{.COMPOSE}} port web 8080); then
          echo "deploy:health: 失败：取不到 web 的宿主端口（web 未运行？先 task up）" >&2
          exit 1
        fi
        # 输出形如 127.0.0.1:8080、0.0.0.0:8080 或 [::]:8080。宿主侧探测一律走回环：
        # 绑定在 0.0.0.0 时从本机打 127.0.0.1 等价，还不依赖内网地址。
        case "$bind" in
          *:*) port="${bind##*:}" ;;
          *) echo "deploy:health: 失败：无法解析 web 的端口映射输出：$bind" >&2; exit 1 ;;
        esac
        hostport="127.0.0.1:$port"
        echo "web 宿主端口：$hostport（compose port 输出：$bind）"

        for path in /healthz /readyz; do
          url="http://$hostport$path"
          if ! code=$(curl -fsS -m 5 -o /dev/null -w '%{http_code}' "$url"); then
            echo "deploy:health: 失败：$url 不可达或状态码 >= 400（容器未起 / 反代 502 / 库未就绪）" >&2
            exit 1
          fi
          case "$code" in
            2??) echo "GET $path -> HTTP $code" ;;
            *) echo "deploy:health: 失败：$url 返回 HTTP $code（要求 2xx）" >&2; exit 1 ;;
          esac
        done

        echo
        echo "== 最近备份时间 =="
        marker=backup/.last_success
        if [ ! -f "$marker" ]; then
          echo "deploy:health: 失败：找不到 $marker，备份从未成功过（先 task deploy:backup）" >&2
          exit 1
        fi
        ts=$(awk 'NR == 1 { print $1 }' "$marker")
        if [ -z "$ts" ]; then
          echo "deploy:health: 失败：$marker 第一行为空，读不到 UTC 时间戳" >&2
          exit 1
        fi
        # 同一份脚本在 GNU date（Linux）与 BSD date（macOS）上都要能解析：先试 GNU 的
        # `date -d`，失败再退 BSD 的 `date -j -f`；两套都按 UTC 解析（-u 与 +%s 配套）。
        if epoch=$(date -u -d "$ts" +%s 2>/dev/null); then
          :
        elif epoch=$(date -u -j -f "%Y-%m-%dT%H:%M:%SZ" "$ts" +%s 2>/dev/null); then
          :
        else
          echo "deploy:health: 失败：无法解析备份时间戳 \"$ts\"（期望形如 2026-11-16T08:22:55Z）" >&2
          exit 1
        fi
        now=$(date -u +%s)
        age=$((now - epoch))
        echo "最近成功备份：$ts（文件：$(awk 'NR == 1 { print $2 }' "$marker")，距今 ${age} 秒）"
        # 每日 03:15 一次备份，26 小时 = 93600 秒，留出约 2 小时余量（任务排队、dump 变慢）。
        # 超过它说明最近两天都没备份成功，按失败处理。
        if [ "$age" -gt 93600 ]; then
          echo "deploy:health: 失败：最近一次成功备份距今 ${age} 秒，超过 26 小时（93600 秒）" >&2
          exit 1
        fi
        echo "备份新鲜度：通过（阈值 93600 秒）"

  deploy:smoke:
    desc: 冒烟（opt-in）：临时 project kjs-smoke + 端口 18081 + 临时卷，验完自行 down -v 清理
    # 所有编排细节（-p、override、down -v、断言）都在脚本里；这里只做入口。
    cmds:
      - sh deploy/scripts/smoke.sh

  deploy:rollback:
    desc: 镜像回退：web 与 server 一起换到 tag= 指定的镜像（不重建；.env 里的 IMAGE_TAG 不变）
    # 前后端成对回退：新前端配旧后端最容易出兼容问题，所以两个服务一起换同一个 tag。
    # --no-build 保证只换镜像、不顺手重建；IMAGE_TAG 由 shell 环境传入，优先于 --env-file .env。
    requires:
      vars: [tag]
    preconditions:
      - sh: test -f .env
        msg: 缺少 .env：先 `task deploy:env`（或 `cp .env.example .env`）并填 POSTGRES_PASSWORD
    cmds:
      - 'IMAGE_TAG={{.tag}} {{.COMPOSE}} up -d --no-build web server'
      - |
        echo "deploy:rollback: 已把 web 与 server 切到 IMAGE_TAG={{.tag}}"
        echo "deploy:rollback: 注意：.env 里的 IMAGE_TAG 没有改；后续 task up 要用同一个 tag 时请同步改 .env 的 IMAGE_TAG"

  # ---------- 数据库 ----------
  db:up:
    desc: 只启动数据库
    cmds:
      - '{{.COMPOSE}} up -d postgres'

  db:psql:
    desc: 进入数据库交互终端（用户与库名取编排段的 POSTGRES_USER / POSTGRES_DB）
    # 在容器内展开 $POSTGRES_USER / $POSTGRES_DB：这两个值由 compose 注入 postgres 容器，
    # 是权威来源；在宿主 shell 里展开的话只会拿到默认值甚至空值（.env 不进宿主环境）。
    cmds:
      - "{{.COMPOSE}} exec postgres sh -c 'psql -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\"'"

  db:reset:
    desc: 清空数据卷并重建数据库（危险：本地开发用）
    prompt: 这会删除本地数据库数据，确认继续？
    cmds:
      - '{{.COMPOSE}} down -v'
      - '{{.COMPOSE}} up -d postgres'

  db:dump:
    desc: 导出 -Fc 格式备份到 ./backup
    # 与每日 03:15 定时任务同一份实现（deploy/backup/backup.sh）：备份只此一处，
    # 不再维护第二套 gzip 管道。
    cmds:
      - task: deploy:backup

  db:restore:
    desc: 从备份恢复到显式目标库（转调 restore.sh；需 file= 与 target=，CONFIRM=yes 才执行）
    # 与 deploy:restore 同源：都走 deploy/backup/restore.sh 的同一道确认门与建库检查，
    # 这里只做一次变量转发，不复制命令。
    requires:
      vars: [file, target]
    cmds:
      - task: deploy:restore
        vars:
          file: '{{.file}}'
          target: '{{.target}}'
          CONFIRM: '{{.CONFIRM}}'

  # ---------- 后端 ----------
  backend:run:
    desc: 本机跑后端（数据库需先 task db:up）
    dir: backend
    cmds:
      - '{{.GO}} run ./cmd/server'

  backend:build:
    desc: 编译后端二进制到 backend/bin/server
    dir: backend
    cmds:
      - '{{.GO}} build -o bin/server ./cmd/server'

  backend:test:
    desc: 后端全量测试
    dir: backend
    cmds:
      - '{{.GO}} test -count=1 ./...'

  # 设置端点的并发不变式（settingsMu 串行化）只有带竞态检测器才完整，所以它是
  # 第 9 项的必跑口径、进 gate，而不是一个可选手动任务。
  # -count=1 关掉 go test 的结果缓存：同代码同参数再跑一次时，go 会直接回放上一次
  # （同上一次 gate）的 "ok (cached)"，竞态二进制根本不执行，等于把守门人关掉。
  backend:test-race:
    desc: 后端竞态检测（api 设置端点 + settings 服务，-race 必跑、禁缓存）
    dir: backend
    cmds:
      - '{{.GO}} test -race -count=1 ./internal/api ./internal/settings'

  # 带 DSN 的全量测试必须 -p 1：e2e 与 store 的集成用例都会 DROP SCHEMA public，
  # go test 默认按包并行，两个包同时重建同一个测试库会互踩（详见
  # backend/internal/e2e/collect_pipeline_test.go 的包注释）。
  test-integration:
    desc: 带 KJS_TEST_DSN 的后端全量测试（固定 -p 1 串行）
    dir: backend
    preconditions:
      - sh: test -n "$KJS_TEST_DSN"
        msg: 需先 export KJS_TEST_DSN，且只能指向专用测试库（会重建 public schema）
      - sh: case "$KJS_TEST_DSN" in *_test*) exit 0;; *) exit 1;; esac
        msg: KJS_TEST_DSN 的库名必须以 _test 结尾，避免误清开发/生产库
    cmds:
      - '{{.GO}} test -p 1 -count=1 ./...'

  backend:vet:
    desc: 后端 go vet
    dir: backend
    cmds:
      - '{{.GO}} vet ./...'

  backend:lint:
    desc: 后端静态检查（含 depguard 依赖方向）
    dir: backend
    cmds:
      - golangci-lint run

  backend:fmt:
    desc: 后端格式化
    dir: backend
    cmds:
      - '{{.GO}} fmt ./...'

  # ---------- 前端 ----------
  frontend:install:
    desc: 安装前端依赖
    dir: frontend
    cmds:
      - '{{.PNPM}} install'

  frontend:dev:
    desc: 起前端开发服务器（/api 代理到后端）
    dir: frontend
    cmds:
      - '{{.PNPM}} dev'

  frontend:build:
    desc: 构建前端产物
    dir: frontend
    cmds:
      - '{{.PNPM}} build'

  frontend:test:
    desc: 前端单测
    dir: frontend
    cmds:
      - '{{.PNPM}} test -- --run'

  frontend:lint:
    desc: 前端 eslint + 类型检查
    dir: frontend
    cmds:
      - '{{.PNPM}} exec eslint .'
      - '{{.PNPM}} exec tsc --noEmit'

  frontend:fmt:
    desc: 前端格式化
    dir: frontend
    cmds:
      - '{{.PNPM}} exec prettier --write .'

  # ---------- 门禁 ----------
  fmt:
    desc: 前后端一起格式化
    cmds:
      - task: backend:fmt
      - task: frontend:fmt

  gate:
    desc: 提交前门禁：后端测试/竞态/vet/lint + 前端测试/lint/构建
    cmds:
      - task: backend:test
      - task: backend:test-race
      - task: backend:vet
      - task: backend:lint
      - task: frontend:test
      - task: frontend:lint
      - task: frontend:build
