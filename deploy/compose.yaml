# 本机部署编排：目前只包含 PostgreSQL，查询服务与采集器在后续阶段加入。
# 用法：cp deploy/.env.example deploy/.env 后填值，再 docker compose -f deploy/compose.yaml up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: kjs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kjs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?需要设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kjs}
      # 数据与容器时间统一按国内时区，避免周次换算出偏差
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      # 只绑定回环地址，数据库不对外网暴露
      - "127.0.0.1:5432:5432"
    volumes:
      - kjs-pgdata:/var/lib/postgresql/data
    healthcheck:
      # 采集器与查询服务都靠这个探活判断库可用
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kjs} -d ${POSTGRES_DB:-kjs}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kjs-pgdata:
